<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub – Dein smarter Lernbereich</title>
<meta name="description" content="StudyHub – dein smarter Lernbereich für Noten, Aufgaben, Prüfungen, Lernpläne und Fortschritt.">

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#171923;
  --muted:#707583;
  --border:#e6e8ef;
  --primary:#6956e8;
  --primary2:#8b7cf6;
  --soft:#efedff;
  --danger:#e65353;
  --shadow:0 10px 30px rgba(20,20,40,.07);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body.dark{
  --bg:#101116;
  --card:#181a21;
  --text:#f4f4f7;
  --muted:#a8abb7;
  --border:#2a2d36;
  --soft:#242139;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.nav{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  overflow-x:auto;
}

.dark .nav{
  background:rgba(16,17,22,.92);
}

.navInner{
  max-width:1400px;
  margin:auto;
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 14px;
  min-width:max-content;
}

.logo{
  font-weight:900;
  font-size:19px;
  margin-right:10px;
  color:var(--primary);
}

.nav button{
  border:0;
  background:transparent;
  color:var(--muted);
  padding:9px 11px;
  border-radius:10px;
  font-weight:600;
  white-space:nowrap;
}

.nav button:hover,
.nav button.active{
  background:var(--soft);
  color:var(--primary);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:30px 18px 70px;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:28px;
}

.hero h1{
  font-size:clamp(30px,5vw,48px);
  line-height:1.05;
  margin:10px 0;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  line-height:1.6;
}

.badge{
  display:inline-block;
  background:var(--soft);
  color:var(--primary);
  border-radius:999px;
  padding:7px 12px;
  font-size:13px;
  font-weight:800;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:22px;
}

.grid.two{
  grid-template-columns:repeat(2,1fr);
}

.grid.four{
  grid-template-columns:repeat(4,1fr);
}

.card,
.featureCard,
.empty,
.plusPromo{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
}

.card h3,
.featureCard h3{
  margin-top:0;
}

.featureCard{
  cursor:pointer;
  transition:.18s;
}

.featureCard:hover{
  transform:translateY(-3px);
}

.featureCard span{
  font-size:30px;
}

.featureCard p,
.card p,
.muted{
  color:var(--muted);
  line-height:1.55;
}

.primary,
.secondary,
.danger,
.smallBtn{
  border-radius:12px;
  padding:11px 16px;
  border:1px solid transparent;
  font-weight:750;
}

.primary{
  background:var(--primary);
  color:white;
}

.primary:hover{
  background:var(--primary2);
}

.secondary{
  background:var(--soft);
  color:var(--primary);
  border-color:transparent;
}

.danger{
  background:#ffe8e8;
  color:var(--danger);
}

.smallBtn{
  padding:7px 10px;
  background:var(--soft);
  color:var(--primary);
}

.full{
  width:100%;
  margin-top:12px;
}

.buttonRow{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:14px;
}

label{
  display:block;
  font-size:13px;
  font-weight:750;
  margin:14px 0 6px;
}

input,
textarea,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  border-radius:12px;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--primary);
}

textarea{
  min-height:150px;
  resize:vertical;
}

.sectionTitle{
  margin:35px 0 16px;
}

.sectionTitle h2{
  margin-bottom:5px;
}

.sectionTitle p{
  color:var(--muted);
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.statIcon{
  font-size:25px;
}

.statNumber{
  font-size:30px;
  font-weight:900;
  margin-top:8px;
}

.statLabel{
  color:var(--muted);
  font-size:14px;
}

.progress{
  height:9px;
  background:var(--border);
  border-radius:99px;
  overflow:hidden;
  margin:15px 0 8px;
}

.progress div{
  height:100%;
  background:var(--primary);
  border-radius:99px;
}

.between,
.cardTop{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.iconBtn{
  border:0;
  background:transparent;
  padding:7px;
  border-radius:8px;
}

.iconBtn:hover{
  background:var(--soft);
}

.task{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid var(--border);
}

.task:last-child{
  border-bottom:0;
}

.task input{
  width:20px;
  height:20px;
}

.task.done strong{
  text-decoration:line-through;
  opacity:.5;
}

.empty{
  text-align:center;
  padding:50px 25px;
  grid-column:1/-1;
}

.emptyIcon{
  font-size:45px;
}

.notice{
  padding:14px;
  background:var(--soft);
  color:var(--muted);
  border-radius:12px;
  margin-top:15px;
  font-size:14px;
}

.checkList div{
  padding:10px 0;
  border-bottom:1px solid var(--border);
}

.bigNumber{
  font-size:52px;
  font-weight:900;
  color:var(--primary);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

.chips span{
  padding:7px 10px;
  border-radius:999px;
  background:var(--soft);
  color:var(--primary);
  font-size:13px;
  font-weight:700;
}

.flashcard{
  border:1px solid var(--border);
  border-radius:12px;
  margin:10px 0;
  overflow:hidden;
}

.flashcard summary{
  padding:14px;
  cursor:pointer;
  font-weight:700;
}

.flashcard p{
  padding:0 14px 14px;
}

.riskRow,
.reviewItem,
.radarItem{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.riskRow:last-child,
.reviewItem:last-child,
.radarItem:last-child{
  border-bottom:0;
}

.riskBars{
  display:flex;
  gap:4px;
  margin-top:7px;
}

.riskBars span{
  width:25px;
  height:5px;
  border-radius:5px;
  background:var(--border);
}

.riskBars span.active{
  background:var(--primary);
}

.difficulty{
  display:flex;
  gap:5px;
}

.difficulty button{
  width:32px;
  height:32px;
  border:1px solid var(--border);
  border-radius:8px;
  background:var(--card);
  color:var(--text);
}

.difficulty button.selected{
  background:var(--primary);
  color:white;
  border-color:var(--primary);
}

.planStep{
  display:flex;
  gap:15px;
  padding:15px 0;
  border-bottom:1px solid var(--border);
}

.planStep b{
  width:35px;
  height:35px;
  display:grid;
  place-items:center;
  background:var(--soft);
  color:var(--primary);
  border-radius:50%;
}

.planStep div{
  display:flex;
  flex-direction:column;
  gap:4px;
}

.simulatorCard{
  max-width:850px;
  margin:auto;
}

.simProgress{
  height:7px;
  background:var(--border);
  border-radius:10px;
  margin-bottom:30px;
  overflow:hidden;
}

.simProgress div{
  height:100%;
  background:var(--primary);
}

.activityChart{
  display:flex;
  align-items:end;
  justify-content:space-around;
  height:220px;
  gap:15px;
}

.activityDay{
  height:100%;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:end;
  gap:7px;
}

.activityBar{
  width:100%;
  max-width:45px;
  height:150px;
  background:var(--soft);
  border-radius:10px;
  display:flex;
  align-items:end;
  overflow:hidden;
}

.activityBar span{
  width:100%;
  background:var(--primary);
  border-radius:10px;
}

.templateText{
  white-space:pre-wrap;
  font-family:inherit;
  color:var(--muted);
  line-height:1.6;
}

.plusHero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#171528,#302765);
  color:white;
  padding:55px 40px;
  border-radius:28px;
  margin-bottom:35px;
}

.plusHero h1{
  font-size:clamp(38px,7vw,70px);
  line-height:1;
  margin:18px 0;
}

.plusHero h1 span{
  color:#bdb5ff;
}

.plusHero p{
  color:#d5d1e9;
  max-width:600px;
  line-height:1.6;
}

.plusPromo{
  margin-top:30px;
  text-align:center;
  padding:45px 25px;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.55);
}

.modal.show{
  display:flex;
}

.modalBox{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:var(--card);
  border-radius:22px;
  padding:25px;
}

.closeModal{
  float:right;
  border:0;
  background:var(--soft);
  border-radius:8px;
  padding:7px 10px;
}

.fileBtn{
  display:inline-flex;
  align-items:center;
  cursor:pointer;
}

.fileBtn input{
  display:none;
}

@media(max-width:850px){
  .grid,
  .grid.two,
  .grid.four{
    grid-template-columns:1fr;
  }

  .hero{
    flex-direction:column;
    align-items:flex-start;
  }

  .container{
    padding:22px 13px 60px;
  }

  .plusHero{
    padding:40px 25px;
  }

  .navInner{
    padding-left:8px;
  }
}
</style>
</head>

<body>

<nav class="nav">
  <div class="navInner">
    <div class="logo">✨ StudyHub</div>

    <button data-page="home">🏠 Home</button>
    <button data-page="grades">📚 Noten</button>
    <button data-page="timer">⏱️ Timer</button>
    <button data-page="tasks">✅ Aufgaben</button>
    <button data-page="exams">🎓 Prüfungen</button>
    <button data-page="rescue">🚨 Exam Rescue</button>
    <button data-page="material">🧠 Lernmaterial</button>
    <button data-page="radar">🧩 Knowledge Radar</button>
    <button data-page="simulator">🧪 Simulator</button>
    <button data-page="gaps">🔎 Wissenslücken</button>
    <button data-page="brain">🧹 Brain Dump</button>
    <button data-page="reviews">🔁 Wiederholen</button>
    <button data-page="templates">📋 Templates</button>
    <button data-page="stats">📊 Statistik</button>
    <button data-page="plus">✨ Plus</button>
    <button data-page="settings">⚙️</button>
  </div>
</nav>

<main class="container" id="app"></main>

<div class="modal" id="modal">
  <div class="modalBox">
    <button class="closeModal" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script>

const KEY="studyhub_final_v1";

const defaultData={
  grades:[],
  tasks:[],
  exams:[],
  materials:[],
  gaps:[],
  reviews:[],
  sessions:[],
  templates:[],
  minutes:0,
  streak:0,
  lastStudy:"",
  settings:{
    dark:false,
    dailyGoal:60
  },
  sim:{
    lastScore:null,
    lastTotal:0
  }
};

let data=loadData();
let timer=null;
let timerSeconds=25*60;
let timerMode="focus";
let timerInitialSeconds=25*60;
let simSession=null;

function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY));

    if(!saved) return structuredClone(defaultData);

    return {
      ...structuredClone(defaultData),
      ...saved,
      settings:{
        ...defaultData.settings,
        ...(saved.settings||{})
      },
      sim:{
        ...defaultData.sim,
        ...(saved.sim||{})
      }
    };
  }catch(e){
    return structuredClone(defaultData);
  }
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(value){
  return String(value??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function today(){
  return new Date().toISOString().slice(0,10);
}

function uid(){
  return Date.now().toString(36)+Math.random().toString(36).slice(2);
}

function daysUntil(date){
  const now=new Date();
  const target=new Date(date+"T00:00:00");
  return Math.ceil((target-now)/86400000);
}

function applyTheme(){
  document.body.classList.toggle("dark",!!data.settings.dark);
}

function nav(page){
  data.currentPage=page;
  save();
  render();
  window.scrollTo({top:0,behavior:"smooth"});
}

document.addEventListener("click",function(e){
  const button=e.target.closest("[data-page]");

  if(button){
    nav(button.dataset.page);
  }
});

function statCard(icon,value,label){
  return `
    <div class="stat">
      <div class="statIcon">${icon}</div>
      <div class="statNumber">${esc(value)}</div>
      <div class="statLabel">${esc(label)}</div>
    </div>
  `;
}


/* HOME */

function homePage(){

  const completed=data.tasks.filter(t=>t.done).length;
  const next=[...data.exams]
    .filter(e=>daysUntil(e.date)>=0)
    .sort((a,b)=>new Date(a.date)-new Date(b.date))[0];

  const goal=Number(data.settings.dailyGoal||60);

  return `
    <div class="hero">
      <div>
        <span class="badge">✨ StudyHub</span>
        <h1>Dein smarter Lernbereich.</h1>
        <p>
          Alles für Schule, Prüfungen und Lernen an einem Ort.
        </p>
      </div>

      <button class="primary" onclick="nav('plus')">
        ✨ StudyHub Plus
      </button>
    </div>

    <div class="grid four">
      ${statCard("⏱️",data.minutes,"Lernminuten")}
      ${statCard("🔥",data.streak,"Tage Streak")}
      ${statCard("✅",completed,"Aufgaben erledigt")}
      ${statCard("🎯",goal,"Tagesziel")}
    </div>

    <div class="grid two">

      <div class="card">
        <h3>🎯 Tagesfortschritt</h3>

        <div class="progress">
          <div style="width:${Math.min(100,(data.minutes/goal)*100)}%"></div>
        </div>

        <div class="between">
          <span>${data.minutes} / ${goal} Minuten</span>
          <strong>${Math.min(100,Math.round((data.minutes/goal)*100))}%</strong>
        </div>

        <button class="secondary full" onclick="nav('timer')">
          ⏱️ Lernen starten
        </button>
      </div>

      <div class="card">
        <h3>🎓 Nächste Prüfung</h3>

        ${
          next
          ?
          `
            <h2>${esc(next.name)}</h2>
            <p>${esc(next.subject||"")} · ${esc(next.date)}</p>

            <div class="progress">
              <div style="width:${next.progress||0}%"></div>
            </div>

            <button class="secondary full" onclick="nav('rescue')">
              🚨 Exam Rescue öffnen
            </button>
          `
          :
          `
            <p>Noch keine Prüfung geplant.</p>
            <button class="primary full" onclick="openModal('exam')">
              ＋ Prüfung erstellen
            </button>
          `
        }
      </div>

    </div>

    <div class="sectionTitle">
      <h2>🚀 Schnellzugriff</h2>
    </div>

    <div class="grid four">

      <div class="featureCard" onclick="nav('tasks')">
        <span>✅</span>
        <h3>Aufgaben</h3>
        <p>Was steht heute an?</p>
      </div>

      <div class="featureCard" onclick="nav('material')">
        <span>🧠</span>
        <h3>Lernmaterial</h3>
        <p>Aus Stoff Lernkarten machen.</p>
      </div>

      <div class="featureCard" onclick="nav('simulator')">
        <span>🧪</span>
        <h3>Simulator</h3>
        <p>Teste dein Wissen.</p>
      </div>

      <div class="featureCard" onclick="nav('radar')">
        <span>🧩</span>
        <h3>Knowledge Radar</h3>
        <p>Finde deine Lücken.</p>
      </div>

    </div>
  `;
}


/* NOTEN */

function gradeAverage(){
  if(!data.grades.length) return "–";

  const sum=data.grades.reduce((s,g)=>s+Number(g.grade)*Number(g.weight||1),0);
  const weights=data.grades.reduce((s,g)=>s+Number(g.weight||1),0);

  return (sum/weights).toFixed(2);
}

function gradesPage(){
  return `
    <div class="hero">
      <div>
        <span class="badge">📚 Noten</span>
        <h1>Dein Notenbereich.</h1>
        <p>Behalte deine Leistungen und deinen Durchschnitt im Blick.</p>
      </div>

      <button class="primary" onclick="openModal('grade')">
        ＋ Note
      </button>
    </div>

    <div class="grid two">

      <div class="stat">
        <div class="statIcon">📊</div>
        <div class="statNumber">${gradeAverage()}</div>
        <div class="statLabel">gewichteter Durchschnitt</div>
      </div>

      <div class="card">
        <h3>🎯 Zielnote</h3>
        <input id="targetGrade" type="number" step=".1" min="1" max="6" placeholder="z. B. 2.0">
        <button class="secondary full" onclick="calculateTarget()">
          Ziel berechnen
        </button>
        <p id="targetResult"></p>
      </div>

    </div>

    <div class="card">
      <h3>Deine Noten</h3>

      ${
        data.grades.length
        ?
        data.grades.map((g,i)=>`
          <div class="reviewItem">
            <div>
              <strong>${esc(g.subject)}</strong>
              <p class="muted">Note ${g.grade} · Gewicht ${g.weight||1}</p>
            </div>

            <button class="iconBtn" onclick="deleteGrade(${i})">🗑️</button>
          </div>
        `).join("")
        :
        `<p class="muted">Noch keine Noten eingetragen.</p>`
      }

    </div>
  `;
}

function addGrade(){
  const subject=document.getElementById("gradeSubject").value.trim();
  const grade=Number(document.getElementById("gradeValue").value);
  const weight=Number(document.getElementById("gradeWeight").value||1);

  if(!subject || !grade){
    alert("Bitte Fach und Note eingeben.");
    return;
  }

  data.grades.push({
    id:uid(),
    subject,
    grade,
    weight
  });

  save();
  closeModal();
  render();
}

function deleteGrade(i){
  data.grades.splice(i,1);
  save();
  render();
}

function calculateTarget(){
  const target=Number(document.getElementById("targetGrade").value);

  if(!target){
    alert("Gib zuerst eine Zielnote ein.");
    return;
  }

  const current=Number(gradeAverage());

  document.getElementById("targetResult").textContent=
    `Dein aktueller Durchschnitt liegt bei ${current||"–"}. `+
    `Für eine genaue Zielberechnung brauchst du die Gewichtung deiner kommenden Leistung.`;
}


/* TIMER */

function fmt(sec){
  const m=Math.floor(sec/60).toString().padStart(2,"0");
  const s=(sec%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}

function timerPage(){
  return `
    <div class="hero">
      <div>
        <span class="badge">⏱️ Fokus Timer</span>
        <h1>${timerMode==="focus"?"Zeit zum Lernen.":"Zeit für eine Pause."}</h1>
        <p>Arbeite konzentriert und gib deinem Kopf danach eine echte Pause.</p>
      </div>
    </div>

    <div class="card simulatorCard" style="text-align:center">

      <div class="bigNumber" id="timerDisplay">${fmt(timerSeconds)}</div>

      <p>${timerMode==="focus"?"Focus Session":"Pause"}</p>

      <div class="buttonRow" style="justify-content:center">
        <button class="primary" onclick="toggleTimer()">
          ${timer?"⏸️ Pause":"▶️ Start"}
        </button>

        <button class="secondary" onclick="resetTimer()">
          ↻ Reset
        </button>
      </div>

      <div class="buttonRow" style="justify-content:center">
        <button class="smallBtn" onclick="setTimer(15)">15 min</button>
        <button class="smallBtn" onclick="setTimer(25)">25 min</button>
        <button class="smallBtn" onclick="setTimer(45)">45 min</button>
        <button class="smallBtn" onclick="setTimer(60)">60 min</button>
      </div>

    </div>
  `;
}

function setTimer(minutes){
  clearInterval(timer);
  timer=null;

  timerSeconds=minutes*60;
  timerInitialSeconds=minutes*60;
  timerMode="focus";

  render();
}

function toggleTimer(){

  if(timer){
    clearInterval(timer);
    timer=null;
    render();
    return;
  }

  timer=setInterval(()=>{

    timerSeconds--;

    const display=document.getElementById("timerDisplay");

    if(display){
      display.textContent=fmt(timerSeconds);
    }

    if(timerSeconds<=0){

      clearInterval(timer);
      timer=null;

      if(timerMode==="focus"){

        const studied=Math.round(timerInitialSeconds/60);

        data.minutes+=studied;

        const now=today();

        if(data.lastStudy!==now){
          data.streak++;
          data.lastStudy=now;
        }

        data.sessions.push({
          id:uid(),
          date:now,
          type:"Focus",
          minutes:studied
        });

        save();

        alert(`Focus Session geschafft! +${studied} Lernminuten 🎉`);

        timerMode="break";
        timerSeconds=5*60;
        timerInitialSeconds=5*60;

      }else{

        timerMode="focus";
        timerSeconds=25*60;
        timerInitialSeconds=25*60;

        alert("Pause vorbei. Bereit für die nächste Runde? 🚀");
      }

      render();
    }

  },1000);

  render();
}

function resetTimer(){
  clearInterval(timer);
  timer=null;
  timerMode="focus";
  timerSeconds=25*60;
  timerInitialSeconds=25*60;
  render();
}

function loadTextFile(event){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    document.getElementById("materialInput").value=reader.result;
  };

  reader.readAsText(file);
}

function analyzeMaterial(){

  const text=document.getElementById("materialInput").value.trim();

  if(!text){
    alert("Bitte zuerst Lernstoff einfügen.");
    return;
  }

  const sentences=text
    .split(/(?<=[.!?])\s+|\n+/)
    .map(x=>x.trim())
    .filter(x=>x.length>20);

  const words=(text.toLowerCase().match(/[a-zäöüß]{5,}/g)||[]);

  const stop=new Set([
    "diese","dieser","dieses","werden","wurde","durch",
    "dabei","nicht","auch","oder","eine","einer","einem",
    "einen","sind","wird","haben","kann","dass","sich",
    "mehr","sehr","über","unter","damit"
  ]);

  const frequency={};

  words.forEach(w=>{
    if(!stop.has(w)){
      frequency[w]=(frequency[w]||0)+1;
    }
  });

  const keywords=Object.entries(frequency)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10)
    .map(x=>x[0]);

  const summary=sentences.slice(0,5).join(" ");

  const cards=sentences.slice(0,8).map((sentence,i)=>({
    q:`Was ist die wichtigste Aussage aus Abschnitt ${i+1}?`,
    a:sentence
  }));

  const questions=keywords.slice(0,6).map(word=>
    `Erkläre den Begriff „${word}“ in eigenen Worten.`
  );

  const material={
    title:keywords.slice(0,3).join(" · ")||"Lernmaterial",
    summary,
    keywords,
    cards,
    questions
  };

  data.materials.push({
    id:uid(),
    ...material,
    date:today()
  });

  save();

  document.getElementById("materialResult").innerHTML=`

    <div class="sectionTitle">
      <h2>✨ Deine Analyse</h2>
    </div>

    <div class="card">
      <h3>📌 Zusammenfassung</h3>
      <p>${esc(summary||"Keine Zusammenfassung möglich.")}</p>
    </div>

    <div class="grid two">

      <div class="card">
        <h3>🔑 Schlüsselbegriffe</h3>

        <div class="chips">
          ${keywords.map(k=>`<span>${esc(k)}</span>`).join("")}
        </div>
      </div>

      <div class="card">
        <h3>❓ Fragen</h3>

        ${questions.map(q=>`
          <div class="notice">${esc(q)}</div>
        `).join("")}
      </div>

    </div>

    <div class="card">
      <h3>🃏 Lernkarten</h3>

      ${cards.map(c=>`
        <details class="flashcard">
          <summary>${esc(c.q)}</summary>
          <p>${esc(c.a)}</p>
        </details>
      `).join("")}
    </div>

    <button class="primary" onclick="createGapFromMaterial()">
      🧩 Als Wissenslücke speichern
    </button>
  `;
}

function startSimulator(){

  const subject=document.getElementById("simSubject").value.trim()||"Allgemein";
  const topic=document.getElementById("simTopic").value.trim()||"Grundlagen";
  const count=Number(document.getElementById("simCount").value);

  const templates=[
    `Definiere ${topic} und nenne die wichtigsten Merkmale.`,
    `Erkläre ${topic} Schritt für Schritt.`,
    `Warum ist ${topic} wichtig? Begründe deine Antwort.`,
    `Nenne ein Beispiel für ${topic}.`,
    `Vergleiche zwei wichtige Aspekte von ${topic}.`,
    `Welche Fehler können bei ${topic} passieren?`,
    `Was musst du über ${topic} unbedingt wissen?`,
    `Erkläre ${topic} so, dass es eine jüngere Person versteht.`,
    `Welche Zusammenhänge gibt es bei ${topic}?`,
    `Formuliere selbst eine Prüfungsfrage zu ${topic}.`
  ];

  simSession={
    subject,
    topic,
    questions:templates.slice(0,count),
    index:0,
    answers:[]
  };

  render();
}

function submitSimulator(){

  const answer=document.getElementById("simAnswer").value.trim();

  if(answer.length<5){
    alert("Versuche etwas ausführlicher zu antworten.");
    return;
  }

  simSession.answers.push(answer);
  simSession.index++;

  if(simSession.index>=simSession.questions.length){

    const total=simSession.questions.length;

    let points=0;

    simSession.answers.forEach(answer=>{
      if(answer.length>180) points+=1;
      else if(answer.length>80) points+=.8;
      else if(answer.length>30) points+=.6;
      else points+=.3;
    });

    const score=Math.min(100,Math.round(points/total*100));

    data.sim={
      lastScore:score,
      lastTotal:total
    };

    data.sessions.push({
      id:uid(),
      type:"Simulator",
      date:today(),
      score,
      minutes:0
    });

    save();

    simSession=null;

    alert(`Simulation beendet! Ergebnis: ${score}% 🎉`);

    render();

    return;
  }

  render();
}

        }

function addReview(){

  const topic=document.getElementById("reviewTopic").value.trim();

  if(!topic){
    alert("Bitte Thema eingeben.");
    return;
  }

  data.reviews.push({
    id:uid(),
    topic,
    due:document.getElementById("reviewDate").value||today(),
    stage:0
  });

  save();
  closeModal();
  render();
}

function completeReview(id){

  const review=data.reviews.find(r=>r.id===id);

  if(!review) return;

  const intervals=[1,3,7,14,30];

  review.stage=Math.min((review.stage||0)+1,intervals.length-1);

  const date=new Date();
  date.setDate(date.getDate()+intervals[review.stage]);

  review.due=date.toISOString().slice(0,10);

  save();
  render();
}

function delayReview(id){

  const review=data.reviews.find(r=>r.id===id);

  if(!review) return;

  const date=new Date();
  date.setDate(date.getDate()+1);

  review.due=date.toISOString().slice(0,10);

  save();
  render();
}

function convertBrainDump(){

  const text=document.getElementById("brainInput").value.trim();

  if(!text){
    alert("Schreib zuerst etwas auf.");
    return;
  }

  const items=text
    .split(/\n|;|(?<=\.)\s+/)
    .map(x=>x.replace(/^[-•*]\s*/,"").trim())
    .filter(Boolean);

  items.forEach(item=>{

    data.tasks.push({
      id:uid(),
      title:item,
      subject:"Brain Dump",
      date:today(),
      minutes:20,
      done:false
    });

  });

  save();

  alert(`${items.length} Aufgaben erstellt! ✨`);

  nav("tasks");
}

function statsPage(){

  const completed=data.tasks.filter(t=>t.done).length;

  const rate=data.tasks.length
    ?Math.round(completed/data.tasks.length*100)

  const avgSim=data.sessions.length
    ?Math.round(
      data.sessions.reduce((s,x)=>s+Number(x.score||0),0)
      /data.sessions.length
    )
    :0;

  return `
    <div class="hero">
      <div>
        <span class="badge">📊 Advanced Stats</span>

        <p>Sieh, was du bereits geschafft hast.</p>

    </div>

    <div class="grid four">
      ${statCard("⏱️",data.minutes,"Lernminuten")}
      ${statCard("🔥",data.streak,"Streak")}
      ${statCard("✅",rate+"%","Aufgabenrate")}
      ${statCard("🧪",avgSim+"%","Simulator")}
    </div>

    <div class="card">

      <h3>📅 Letzte 7 Tage</h3>

      <div class="activityChart">

        ${lastSevenDays().map(d=>`

          <div class="activityDay">

            <div class="activityBar">
              <span style="height:${Math.min(100,d.minutes/60*100)}%"></span>
            </div>

            <strong>${d.minutes}</strong>
            <small>${d.label}</small>

          </div>

        `).join("")}

      </div>

    </div>
  `;
}

function lastSevenDays(){

  const arr=[];

  for(let i=6;i>=0;i--){

    const date=new Date();
    date.setDate(date.getDate()-i);

    const key=date.toISOString().slice(0,10);

    const minutes=data.sessions
      .filter(s=>s.date===key)
      .reduce((sum,s)=>sum+Number(s.minutes||0),0);

    arr.push({
      label:date.toLocaleDateString("de-DE",{weekday:"short"}),
      minutes
    });
  }

  return arr;
}

function saveSettings(){

  const value=Number(document.getElementById("dailyGoal").value);

  data.settings.dailyGoal=Math.max(5,Math.min(600,value));

  save();
  render();
}

function toggleDark(){

  data.settings.dark=!data.settings.dark;

  save();
  render();
}

function exportData(){

  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);

  const a=document.createElement("a");
  a.href=url;
  a.download="studyhub-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}

function importData(event){

  const file=event.target.files[0];

  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{

    try{

      const imported=JSON.parse(reader.result);

      data={
        ...structuredClone(defaultData),
        ...imported,
        settings:{
          ...defaultData.settings,
          ...(imported.settings||{})
        }
      };

      save();
      render();

      alert("Backup importiert! ✨");

    }catch(e){

      alert("Die Datei konnte nicht gelesen werden.");

    }

  };

  reader.readAsText(file);
}

function resetAll(){

  if(!confirm("Wirklich alle StudyHub-Daten löschen?")) return;

  localStorage.removeItem(KEY);

  location.reload();
}
