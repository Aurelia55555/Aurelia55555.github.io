<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="StudyHub Plus – smarter lernen mit Lernmaterial Lab, Exam Rescue, Knowledge Radar und Prüfungssimulator.">
<meta name="theme-color" content="#6c63ff">
<title>StudyHub Plus – Dein smarter Lernbereich</title>

<style>
:root{
  --bg:#f6f7fb;
  --card:#fff;
  --text:#171923;
  --muted:#687083;
  --line:#e7e9f0;
  --primary:#6c63ff;
  --primary2:#5148e8;
  --soft:#eeecff;
  --good:#22a06b;
  --warn:#d79517;
  --bad:#dc5262;
  --shadow:0 10px 30px rgba(30,35,60,.08);
  --radius:18px;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
}

button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(246,247,251,.94);
  backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}

.topin{
  max-width:1250px;
  margin:auto;
  padding:13px 16px;
  display:flex;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:20px;
  font-weight:900;
  white-space:nowrap;
}

.logo span{color:var(--primary)}

.nav{
  display:flex;
  gap:5px;
  overflow:auto;
  scrollbar-width:none;
}

.nav::-webkit-scrollbar{display:none}

.nav button{
  background:transparent;
  color:var(--muted);
  padding:9px 10px;
  border-radius:11px;
  white-space:nowrap;
}

.nav button:hover,
.nav button.active{
  background:var(--soft);
  color:var(--primary);
  font-weight:800;
}

main{
  max-width:1250px;
  margin:auto;
  padding:25px 16px 70px;
}

.page{display:none}
.page.active{display:block}

.hero{
  background:linear-gradient(135deg,#171923,#39316f);
  color:#fff;
  border-radius:25px;
  padding:30px;
  margin-bottom:20px;
  box-shadow:var(--shadow);
}

.hero h1{
  font-size:clamp(28px,5vw,45px);
  margin:0 0 8px;
}

.hero p{
  margin:0;
  color:#e0e1ed;
  line-height:1.6;
  max-width:760px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:15px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:15px;
}

.grid4{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:19px;
  box-shadow:var(--shadow);
  margin-bottom:15px;
}

.card h2,
.card h3{
  margin-top:0;
}

.muted{color:var(--muted)}

.small{
  font-size:13px;
  color:var(--muted);
}

.stat{
  font-size:30px;
  font-weight:900;
  margin:6px 0;
}

.btn{
  background:var(--primary);
  color:#fff;
  padding:10px 14px;
  border-radius:11px;
  font-weight:800;
}

.btn:hover{background:var(--primary2)}

.btn.secondary{
  background:var(--soft);
  color:var(--primary);
}

.btn.ghost{
  background:transparent;
  border:1px solid var(--line);
  color:var(--muted);
}

.btn.danger{
  background:#ffe9ed;
  color:#b52e41;
}

.actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:12px;
}

input,
textarea,
select{
  width:100%;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:var(--card);
  color:var(--text);
  outline:0;
}

textarea{
  min-height:145px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--primary);
  box-shadow:0 0 0 3px var(--soft);
}

label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin:10px 0 5px;
}

.row{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}

.row3{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.list{
  display:flex;
  flex-direction:column;
  gap:9px;
}

.item{
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px;
  background:var(--card);
}

.item.done{opacity:.62}

.item.done .itemtitle{
  text-decoration:line-through;
}

.itemtitle{
  font-weight:800;
}

.tag{
  display:inline-block;
  padding:4px 8px;
  border-radius:99px;
  background:var(--soft);
  color:var(--primary);
  font-size:12px;
  font-weight:800;
  margin:3px 3px 3px 0;
}

.pill{
  padding:7px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:900;
  display:inline-block;
}

.green{
  background:#e4f7ee;
  color:#18764f;
}

.yellow{
  background:#fff5d9;
  color:#956400;
}

.red{
  background:#ffe6ea;
  color:#ad3042;
}

.bar{
  height:10px;
  background:#ececf2;
  border-radius:99px;
  overflow:hidden;
}

.bar>i{
  display:block;
  height:100%;
  background:var(--primary);
  border-radius:99px;
}

.progress{margin:10px 0}

.big{
  font-size:44px;
  font-weight:950;
}

.timer{
  text-align:center;
  padding:20px;
}

.timer .big{
  font-size:76px;
  letter-spacing:2px;
}

.feature{
  height:100%;
  transition:.15s;
}

.feature:hover{
  transform:translateY(-2px);
}

.feature .icon{
  font-size:30px;
}

.notice{
  padding:12px 14px;
  background:var(--soft);
  border-radius:12px;
  color:#4d45a9;
  line-height:1.5;
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:18px 0;
}

.hide{display:none!important}

.dark{
  --bg:#101116;
  --card:#181a21;
  --text:#f4f4f7;
  --muted:#a8abb8;
  --line:#2a2d37;
  --soft:#28244c;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}

.dark .top{
  background:rgba(16,17,22,.94);
}

.dark .hero{
  background:linear-gradient(135deg,#11121a,#2d275b);
}

.dark .bar{
  background:#2a2d36;
}

.dark .green{background:#163d2e}
.dark .yellow{background:#443817}
.dark .red{background:#49232b}

@media(max-width:850px){

  .grid,
  .grid4{
    grid-template-columns:1fr 1fr;
  }

  .topin{
    align-items:flex-start;
    flex-direction:column;
    gap:7px;
  }

  .nav{
    width:100%;
  }
}

@media(max-width:600px){

  main{
    padding:18px 11px 50px;
  }

  .grid,
  .grid2,
  .grid4,
  .row,
  .row3{
    grid-template-columns:1fr;
  }

  .hero{
    padding:22px;
  }

  .timer .big{
    font-size:58px;
  }

  .card{
    padding:15px;
  }
}
</style>
</head>

<body>

<header class="top">
  <div class="topin">

    <div class="logo">
      Study<span>Hub</span> ✨
    </div>

    <nav class="nav" id="nav"></nav>

  </div>
</header>

<main id="app"></main>

<script>

const KEY="studyhub_plus_complete_v3";

const defaults={
  grades:[],
  tasks:[],
  exams:[],
  materials:[],
  mistakes:[],
  reviews:[],
  sessions:[],
  templates:[],
  settings:{
    dark:false,
    dailyGoal:60
  },
  minutes:0,
  streak:0,
  lastStudy:"",
  brainDump:"",
  sim:{
    lastScore:null,
    lastTotal:0
  }
};

let data=load();

let timer=null;
let timerSeconds=1500;
let timerMode="focus";

let materialResult=null;

let simQuestions=[];
let simIndex=0;
let simAnswers=[];

function load(){

  try{

    const saved=JSON.parse(
      localStorage.getItem(KEY)||"{}"
    );

    return {
      ...defaults,
      ...saved,
      settings:{
        ...defaults.settings,
        ...(saved.settings||{})
      },
      sim:{
        ...defaults.sim,
        ...(saved.sim||{})
      }
    };

  }catch(e){

    return JSON.parse(JSON.stringify(defaults));

  }

}

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

  applyTheme();

}

function applyTheme(){

  document.body.classList.toggle(
    "dark",
    !!data.settings.dark
  );

}

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}

function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}

function daysUntil(date){

  if(!date)return 999;

  return Math.ceil(
    (
      new Date(date)-
      new Date(today())
    )/86400000
  );

}

function uid(){

  return Date.now()+
    Math.random()
      .toString(16)
      .slice(2);

}

const navItems=[

  ["home","🏠 Home"],
  ["grades","📚 Noten"],
  ["timer","⏱️ Timer"],
  ["tasks","✅ Aufgaben"],
  ["exams","🎓 Exam Planner"],

  ["rescue","🚨 Exam Rescue"],
  ["material","🧠 Material Lab"],
  ["radar","📡 Knowledge Radar"],
  ["simulator","🧪 Prüfungssimulator"],

  ["gaps","🧩 Wissenslücken"],
  ["brain","🧹 Brain Dump"],
  ["reviews","🔁 Wiederholen"],

  ["templates","📋 Templates"],
  ["stats","📊 Advanced Stats"],

  ["plus","✨ StudyHub Plus"],
  ["settings","⚙️ Einstellungen"]

];

document.getElementById("nav").innerHTML=
  navItems.map(
    ([id,title])=>
      `<button
        data-page="${id}"
        onclick="navTo('${id}')"
      >
        ${title}
      </button>`
  ).join("");

function navTo(id){

  document
    .querySelectorAll(".page")
    .forEach(
      x=>x.classList.remove("active")
    );

  const page=document.getElementById(id);

  if(page){
    page.classList.add("active");
  }

  document
    .querySelectorAll("#nav button")
    .forEach(
      b=>b.classList.toggle(
        "active",
        b.dataset.page===id
      )
    );

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

function page(id,html){

  return `
    <section
      class="page"
      id="${id}"
    >
      ${html}
    </section>
  `;

}

function statCard(icon,title,value,sub){

  return `
    <div class="card">

      <div>${icon}</div>

      <div class="stat">
        ${esc(value)}
      </div>

      <b>${title}</b>

      <div class="small">
        ${esc(sub)}
      </div>

    </div>
  `;

}

function render(){

  applyTheme();

  document.getElementById("app").innerHTML=`

    ${homePage()}
    ${gradesPage()}
    ${timerPage()}
    ${tasksPage()}
    ${examsPage()}

    ${rescuePage()}
    ${materialPage()}
    ${radarPage()}
    ${simPage()}

    ${gapsPage()}
    ${brainPage()}
    ${reviewsPage()}

    ${templatesPage()}
    ${statsPage()}
    ${plusPage()}
    ${settingsPage()}

  `;

  navTo("home");

}

function homePage(){

  const avg=gradeAvg();

  const open=
    data.tasks.filter(
      x=>!x.done
    ).length;

  const next=
    [...data.exams]
      .sort(
        (a,b)=>
          a.date.localeCompare(b.date)
      )[0];

  return page(
    "home",

    `

    <div class="hero">

      <h1>
        Dein smarter Lernbereich ✨
      </h1>

      <p>
        StudyHub hilft dir dabei,
        aus „Ich muss so viel lernen“
        einen klaren nächsten Schritt zu machen.
      </p>

      <div class="actions">

        <button
          class="btn"
          onclick="navTo('rescue')"
        >
          🚨 Exam Rescue starten
        </button>

        <button
          class="btn secondary"
          onclick="navTo('material')"
        >
          🧠 Lernstoff analysieren
        </button>

      </div>

    </div>

    <div class="grid4">

      ${statCard(
        "⏱️",
        "Lernzeit",
        data.minutes+" min",
        "Gesamt"
      )}

      ${statCard(
        "✅",
        "Offene Aufgaben",
        open,
        ""
      )}

      ${statCard(
        "📚",
        "Notenschnitt",
        avg?avg.toFixed(2):"—",
        ""
      )}

      ${statCard(
        "🔥",
        "Streak",
        data.streak+" Tage",
        ""
      )}

    </div>

    <div class="grid2">

      <div class="card">

        <h2>
          🎯 Nächster sinnvoller Schritt
        </h2>

        ${
          next
          ?
          `
            <p>
              <b>${esc(next.name)}</b>
              ist
              ${
                daysUntil(next.date)<0
                ?"überfällig"
                :
                daysUntil(next.date)===0
                ?"heute"
                :
                "in "+daysUntil(next.date)+" Tagen"
              }.
            </p>

            <button
              class="btn"
              onclick="navTo('rescue')"
            >
              Plan öffnen
            </button>
          `
          :
          `
            <p class="muted">
              Noch keine Prüfung eingetragen.
            </p>

            <button
              class="btn"
              onclick="navTo('exams')"
            >
              Prüfung hinzufügen
            </button>
          `
        }

      </div>

      <div class="card">

        <h2>
          🧭 Dein Plus-Workflow
        </h2>

        <p class="muted">
          Material → Radar → Rescue →
          Simulation → Wiederholen.
        </p>

        <div class="notice">
          💡 Tipp:
          Nicht „alles lernen“.
          Erst herausfinden,
          was den größten Unterschied macht.
        </div>

      </div>

    </div>

    `
  );

}

function gradeAvg(){

  const weight=
    data.grades.reduce(
      (sum,g)=>
        sum+Number(g.weight||1),
      0
    );

  if(!weight)return 0;

  return data.grades.reduce(
    (sum,g)=>
      sum+
      Number(g.val)*
      Number(g.weight||1),
    0
  )/weight;

}

function gradesPage(){

  return page(
    "grades",

    `

    <div class="hero">

      <h1>📚 Noten</h1>

      <p>
        Gewichte deine Noten
        und behalte deinen Schnitt im Blick.
      </p>

    </div>

    <div class="grid2">

      <div class="card">

        <h2>
          Note hinzufügen
        </h2>

        <div class="row">

          <div>
            <label>Fach</label>
            <input
              id="gSub"
              placeholder="Mathe"
            >
          </div>

          <div>
            <label>Note</label>
            <input
              id="gVal"
              type="number"
              min="1"
              max="6"
              step=".1"
              placeholder="2"
            >
          </div>

        </div>

        <label>
          Gewichtung
        </label>

        <input
          id="gWeight"
          type="number"
          min="1"
          value="1"
        >

        <div class="actions">

          <button
            class="btn"
            onclick="addGrade()"
          >
            Hinzufügen
          </button>

        </div>

      </div>

      <div class="card">

        <h2>
          Notenschnitt
        </h2>

        <div class="big">
          ${
            gradeAvg()
            ?gradeAvg().toFixed(2)
            :"—"
          }
        </div>

        <p class="muted">
          ${data.grades.length}
          eingetragene Noten
        </p>

      </div>

    </div>

    <div class="card">

      <h2>
        Deine Noten
      </h2>

      <div class="list">

        ${
          data.grades.length

          ?

          data.grades.map(
            (g,i)=>
              `
              <div class="item">

                <b>
                  ${esc(g.sub)}
                </b>

                · Note ${g.val}
                · Gewicht ${g.weight||1}

                <button
                  class="btn danger"
                  style="float:right"
                  onclick="delGrade(${i})"
                >
                  Löschen
                </button>

              </div>
              `
          ).join("")

          :

          `
          <p class="muted">
            Noch keine Noten.
          </p>
          `
        }

      </div>

    </div>

    `
  );

}

function addGrade(){

  const sub=
    document.getElementById("gSub")
      .value.trim();

  const val=
    Number(
      document.getElementById("gVal").value
    );

  const weight=
    Number(
      document.getElementById("gWeight").value
    )||1;

  if(!sub||!val){
    alert("Bitte Fach und Note eingeben.");
    return;
  }

  data.grades.push({
    id:uid(),
    sub,
    val,
    weight
  });

  save();
  render();
  navTo("grades");

}

function delGrade(i){

  data.grades.splice(i,1);

  save();
  render();
  navTo("grades");

}

function timerPage(){

  return page(
    "timer",

    `

    <div class="hero">

      <h1>
        ⏱️ Fokus-Timer
      </h1>

      <p>
        25 Minuten Fokus,
        5 Minuten Pause –
        oder deine eigene Zeit.
      </p>

    </div>

    <div class="card timer">

      <div class="pill">
        ${
          timerMode==="focus"
          ?"FOKUS"
          :"PAUSE"
        }
      </div>

      <div
        class="big"
        id="timerDisplay"
      >
        ${fmt(timerSeconds)}
      </div>

      <div
        class="actions"
        style="justify-content:center"
      >

        <button
          class="btn"
          onclick="toggleTimer()"
        >
          ▶ Start/Pause
        </button>

        <button
          class="btn secondary"
          onclick="resetTimer()"
        >
          ↺ Reset
        </button>

        <button
          class="btn ghost"
          onclick="setTimer(15)"
        >
          15 min
        </button>

        <button
          class="btn ghost"
          onclick="setTimer(25)"
        >
          25 min
        </button>

        <button
          class="btn ghost"
          onclick="setTimer(45)"
        >
          45 min
        </button>

      </div>

      <p class="small">
        Gesammelte Lernzeit:
        ${data.minutes} Minuten
      </p>

    </div>

    `
  );

}

function fmt(seconds){

  return String(
    Math.floor(seconds/60)
  ).padStart(2,"0")
  +":"
  +
  String(
    seconds%60
  ).padStart(2,"0");

}

function setTimer(minutes){

  clearInterval(timer);

  timer=null;

  timerSeconds=minutes*60;

  timerMode="focus";

  const display=
    document.getElementById(
      "timerDisplay"
    );

  if(display){
    display.textContent=
      fmt(timerSeconds);
  }

}

function toggleTimer(){

  if(timer){

    clearInterval(timer);
    timer=null;
    return;

  }

  timer=setInterval(()=>{

    timerSeconds--;

    const display=
      document.getElementById(
        "timerDisplay"
      );

    if(display){
      display.textContent=
        fmt(timerSeconds);
    }

    if(timerSeconds<=0){

      clearInterval(timer);
      timer=null;

      if(timerMode==="focus"){

        data.minutes+=
          timerSeconds===0
          ?25
          :0;

        updateStreak();
        save();

        alert(
          "Fokus geschafft! 🎉 Zeit für eine kurze Pause."
        );

        timerMode="break";
        timerSeconds=300;

      }else{

        alert(
          "Pause vorbei – bereit für den nächsten Fokus?"
        );

        timerMode="focus";
        timerSeconds=1500;

      }

      render();
      navTo("timer");

    }

  },1000);

}

function resetTimer(){

  clearInterval(timer);

  timer=null;
  timerSeconds=1500;
  timerMode="focus";

  render();
  navTo("timer");

}

function updateStreak(){

  const t=today();

  if(data.lastStudy===t)return;

  const yesterday=
    new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );

  const ys=
    yesterday
      .toISOString()
      .slice(0,10);

  data.streak=
    data.lastStudy===ys
    ?data.streak+1
    :1;

  data.lastStudy=t;

}

function tasksPage(){

  return page(
    "tasks",

    `

    <div class="hero">

      <h1>✅ Aufgaben</h1>

      <p>
        Alles aus deinem Kopf
        in kleine Schritte verwandeln.
      </p>

    </div>

    <div class="card">

      <h2>
        Aufgabe hinzufügen
      </h2>

      <div class="row3">

        <div>
          <label>Aufgabe</label>
          <input
            id="tName"
            placeholder="Vokabeln lernen"
          >
        </div>

        <div>
          <label>Fach</label>
          <input
            id="tSub"
            placeholder="Englisch"
          >
        </div>

        <div>
          <label>Fällig am</label>
          <input
            id="tDate"
            type="date"
          >
        </div>

      </div>

      <label>
        Lernzeit in Minuten
      </label>

      <input
        id="tMin"
        type="number"
        min="5"
        value="20"
      >

      <div class="actions">

        <button
          class="btn"
          onclick="addTask()"
        >
          Hinzufügen

function readMaterialFile(event){

  if(!file) return;

    if(input) input.value=reader.result;
  };

  reader.readAsText(file);
}

function analyzeMaterial(){
  const text=document.getElementById("materialInput")?.value.trim();

  if(!text){
    alert("Füge zuerst Lernstoff ein.");
    return;
  }

  const sentences=text
    .split(/(?<=[.!?])\s+|\n+/)
    .map(x=>x.trim())
    .filter(x=>x.length>25);

  const words=(text.toLowerCase().match(/[a-zäöüß]{5,}/gi)||[]);
  const stop=new Set([
    "dabei","diese","dieser","dieses","werden","wurde","durch",
    "einer","einem","eine","einen","haben","nicht","sowie",
    "oder","auch","dass","sich","sind","wird","kann","mehr",
    "sehr","über","unter","zwischen","damit","wenn","weil"
  ]);

  const counts={};

  words.forEach(w=>{
    if(!stop.has(w)) counts[w]=(counts[w]||0)+1;
  });

  const keywords=Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10)
    .map(x=>x[0]);

  const summary=sentences.slice(0,5).join(" ");

  const cards=sentences.slice(0,8).map((s,i)=>({
    q:`Was ist eine wichtige Aussage aus Abschnitt ${i+1}?`,
    a:s
  }));

  const questions=keywords.slice(0,6).map(k=>`Erkläre den Begriff „${k}“ in eigenen Worten.`);

  const material={
    id:uid(),
    title:keywords.slice(0,3).join(" · ")||"Lernmaterial",
    text,
    summary,
    keywords,
    cards,
    questions,
    date:today()
  };

  data.materials.push(material);
  save();

  renderMaterialOut(material);
}

function startSimulator(){
  const subject=document.getElementById("simSubject")?.value.trim()||"Allgemein";
  const topic=document.getElementById("simTopic")?.value.trim()||"Grundlagen";
  const count=Number(document.getElementById("simCount")?.value||5);

  const templates=[
    `Definiere ${topic} und erkläre die wichtigsten Merkmale.`,
    `Erkläre ${topic} Schritt für Schritt.`,
    `Warum ist ${topic} wichtig? Begründe deine Antwort.`,
    `Nenne ein Beispiel für ${topic} und erkläre es.`,
    `Vergleiche zwei wichtige Aspekte von ${topic}.`,
    `Welche Fehler könnten bei ${topic} häufig passieren?`,
    `Was musst du über ${topic} für eine Prüfung unbedingt wissen?`,
    `Erkläre ${topic}, als würdest du es einer jüngeren Person beibringen.`,
    `Welche Zusammenhänge gibt es bei ${topic}?`,
    `Formuliere eine mögliche Prüfungsfrage zu ${topic} und beantworte sie.`
  ];

  const questions=[];

  for(let i=0;i<count;i++){
    questions.push(templates[i%templates.length]);
  }

  window.simSession={
    subject,
    topic,
    questions,
    index:0,
    answers:[]
  };

  render();
}

function submitSim(){
  const answer=document.getElementById("simAnswer")?.value.trim()||"";

  if(answer.length<5){
    alert("Versuche etwas ausführlicher zu antworten.");
    return;
  }

  window.simSession.answers.push(answer);
  window.simSession.index++;

  if(window.simSession.index>=window.simSession.questions.length){
    finishSim();
    return;
  }

  render();
}

function finishSim(){
  const s=window.simSession;
  const total=s.questions.length;

  const points=s.answers.reduce((sum,a)=>{
    if(a.length>180) return sum+1;
    if(a.length>80) return sum+0.8;
    if(a.length>30) return sum+0.6;
    return sum+0.3;
  },0);

  const score=Math.round((points/total)*100);

  data.sim={
    lastScore:Math.min(100,score),
    lastTotal:total,
    date:today()
  };

  data.sessions.push({
    id:uid(),
    date:today(),
    type:"Prüfungssimulator",
    score:Math.min(100,score),
    total
  });

  save();
  window.simSession=null;

  alert(`Simulation beendet! Ergebnis: ${Math.min(100,score)}%`);
  render();
}

function addReview(){
  const topic=document.getElementById("reviewTopic")?.value.trim();
  const start=document.getElementById("reviewDate")?.value||today();

  if(!topic){
    alert("Bitte Thema eingeben.");
    return;
  }

  data.reviews.push({
    id:uid(),
    topic,
    date:start,
    due:start,
    source:"Manuell",
    stage:0
  });

  save();
  closeModal();
  render();
}

function doneReview(id){
  const r=data.reviews.find(x=>x.id===id);
  if(!r) return;

  const intervals=[1,3,7,14,30];
  const stage=Math.min((r.stage||0)+1,intervals.length-1);
  r.stage=stage;

  const d=new Date();
  d.setDate(d.getDate()+intervals[stage]);
  r.due=d.toISOString().slice(0,10);

  save();
  render();
}

function delayReview(id){
  const r=data.reviews.find(x=>x.id===id);
  if(!r) return;

  const d=new Date();
  d.setDate(d.getDate()+1);
  r.due=d.toISOString().slice(0,10);

  save();
  render();
}

function renderActivityBars(){
  const days=[];

  for(let i=6;i>=0;i--){
    const d=new Date();
    d.setDate(d.getDate()-i);

    const key=d.toISOString().slice(0,10);

    const minutes=data.sessions
      .filter(s=>s.date===key)
      .reduce((sum,s)=>sum+Number(s.minutes||0),0);

    days.push({
      key,
      label:d.toLocaleDateString("de-DE",{weekday:"short"}),
      minutes
    });
  }

  const max=Math.max(60,...days.map(d=>d.minutes));

  return `
    <div class="activityChart">
      ${days.map(d=>`
        <div class="activityDay">
          <div class="activityBar">
            <span style="height:${Math.min(100,(d.minutes/max)*100)}%"></span>
          </div>
          <strong>${d.minutes}</strong>
          <small>${d.label}</small>
        </div>
      `).join("")}
    </div>
  `;
}

function saveSettings(){
  const value=Number(document.getElementById("dailyGoal")?.value||60);

  data.settings.dailyGoal=Math.max(5,Math.min(600,value));
  save();

  alert("Einstellungen gespeichert. ✨");
  render();
}

function toggleDark(){
  data.settings.dark=!data.settings.dark;
  save();
  applyTheme();
  render();
}

function exportData(){
  const blob=new Blob(
    [JSON.stringify(data,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download="studyhub-backup.json";
  a.click();

  URL.revokeObjectURL(url);
}

function importData(event){
  const file=event.target.files?.[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const imported=JSON.parse(reader.result);

      if(typeof imported!=="object"){
        throw new Error("invalid");
      }

      data={
        ...data,
        ...imported,
        settings:{
          ...data.settings,
          ...(imported.settings||{})
        }
      };

      save();
      render();

      alert("Backup erfolgreich importiert. ✨");
    }catch(e){
      alert("Die Datei konnte nicht gelesen werden.");
    }
  };

  reader.readAsText(file);
}

function resetAll(){
  const yes=confirm(
    "Wirklich ALLE StudyHub-Daten löschen? Dieser Schritt kann nicht rückgängig gemacht werden."
  );

  if(!yes) return;

  localStorage.removeItem(KEY);

}

      <input id="examGoal" placeholder="z. B. Note 2">

      <button class="primary full" onclick="addExam()">Prüfung erstellen</button>
    `;
  }

  if(type==="gap"){
    content=`
      <h2>🧩 Wissenslücke</h2>

      <label>Thema</label>
      <input id="gapTopic" placeholder="z. B. Bruchrechnung">

      <label>Schwierigkeit</label>
      <select id="gapDifficulty">
        <option value="1">1 – leicht</option>
        <option value="2">2 – eher leicht</option>
        <option value="3" selected>3 – mittel</option>
        <option value="4">4 – schwierig</option>
        <option value="5">5 – sehr schwierig</option>
      </select>

      <button class="primary full" onclick="addGap()">Lücke speichern</button>
    `;
  }

  if(type==="review"){
    content=`
      <h2>🔁 Wiederholung</h2>

      <label>Thema</label>
      <input id="reviewTopic" placeholder="z. B. Französisch Vokabeln">

      <label>Startdatum</label>
      <input id="reviewDate" type="date" value="${today()}">

      <button class="primary full" onclick="addReview()">Wiederholung planen</button>
    `;
  }

  document.getElementById("modalContent").innerHTML=content;
  document.getElementById("modal").classList.add("show");
}

function closeModal(){
  document.getElementById("modal").classList.remove("show");
}


/* =========================
   NAV + RENDER
========================= */

function render(){
  applyTheme();

  const page=data.currentPage||"home";
  const app=document.getElementById("app");

  if(!app) return;

  const pages={
    home:homePage,
    grades:gradesPage,
    timer:timerPage,
    tasks:tasksPage,
    exams:examsPage,
    rescue:rescuePage,
    material:materialPage,
    radar:radarPage,
    simulator:simPage,
    gaps:gapsPage,
    brain:brainPage,
    reviews:reviewsPage,
    templates:templatesPage,
    stats:statsPage,
    plus:plusPage,
    settings:settingsPage
  };

  const fn=pages[page]||homePage;

  app.innerHTML=fn();

  document.querySelectorAll(".navItem").forEach(btn=>{
    btn.classList.toggle("active",btn.dataset.page===page);
  });
}


/* =========================
   START
========================= */

document.addEventListener("click",e=>{
  const navBtn=e.target.closest("[data-page]");
  if(navBtn){
    nav(navBtn.dataset.page);
  }

  if(e.target.id==="modal"){
    closeModal();
  }
});

document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeModal();
});

render();

</script>

</body>
</html>
