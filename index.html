<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyHub Plus – Dein smarter Lernbereich</title>

<meta name="description"
content="StudyHub Plus – smarter Lernplaner mit Exam Planner, Smart Study, Wissenslücken, Prüfungssimulator, Lernmodus, Brain Dump und Wiederholungen.">

<style>
:root{
  --bg:#f6f7fb;
  --card:#ffffff;
  --text:#20222b;
  --muted:#747887;
  --line:#e5e6ee;
  --accent:#6c63ff;
  --accent2:#8d86ff;
  --good:#31a852;
  --warn:#e7a62d;
  --bad:#df5050;
  --shadow:0 12px 35px rgba(30,32,50,.08);
  --radius:20px;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
  border:0;
}

button:hover{
  transform:translateY(-1px);
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:20px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

.brand{
  font-size:26px;
  font-weight:900;
}

.brand span{
  color:var(--accent);
}

header small{
  color:var(--muted);
}

.nav{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
  margin-bottom:10px;
}

.nav button{
  white-space:nowrap;
  background:var(--card);
  color:var(--text);
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 14px;
}

.nav button.active{
  background:var(--accent);
  color:white;
  border-color:var(--accent);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:20px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}

.hero{
  color:white;
  border:0;
  background:linear-gradient(135deg,#6c63ff,#928aff);
}

.hero h1{
  font-size:34px;
  margin:0 0 8px;
}

.hero p{
  margin:0;
  opacity:.9;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.grid2{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:16px;
}

.stat{
  font-size:29px;
  font-weight:900;
  margin-top:8px;
}

.kpi{
  font-size:24px;
  font-weight:900;
}

.label{

  font-size:13px;
}

h2{
  font-size:23px;
  margin-top:0;
}

h3{
  margin-top:0;
}

.row{
  display:flex;
  flex-wrap:wrap;
  gap:9px;

}

.spread{
  display:flex;

  align-items:center;
  gap:12px;
}

.formgrid{

  grid-template-columns:repeat(2,1fr);
  gap:10px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:var(--accent);
}

button{
  background:#ececf5;
  color:var(--text);
  padding:10px 14px;
  border-radius:12px;
  font-weight:750;
}

.primary{
  background:var(--accent);
  color:white;
}

.good{
  background:#e8f8ed;
  color:#27783a;
}

.warn{
  background:#fff3dd;
  color:#996519;
}

.danger{

}

.pill{
  display:inline-flex;

  border-radius:999px;
  background:#eeeeff;
  color:var(--accent);

  font-weight:800;
}

.list{

  gap:9px;
}

.item{

  padding:14px;

}

.progress{

  height:10px;

  background:#ececf3;

}

.progress span{
  display:block;
  height:100%;
  background:var(--accent);
  border-radius:99px;

}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.big{

}

.score{

.feature{

.icon{

.notice{

  border-radius:14px;
  padding:14px;
}

.warning{
  background:#fff4df;
  border-color:#ffe1a8;
}

.success{
  background:#ebf9ee;
  border-color:#c9edcf;
}

.tag{
  display:inline-block;
  padding:5px 8px;
  margin:3px;
  border-radius:8px;
  background:#f0f0f7;
  font-size:12px;
}

.timer{
  text-align:center;
  font-size:68px;
  font-weight:900;
  margin:15px 0;
}

.center{
  text-align:center;
}

hr{
  border:0;
  border-top:1px solid var(--line);
  margin:20px 0;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:10px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.choice{
  padding:12px;
  border:1px solid var(--line);
  border-radius:12px;
  margin-bottom:8px;
  cursor:pointer;
}

.choice:hover{
  border-color:var(--accent);
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.hidden{
  display:none!important;
}

#toast{
  position:fixed;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  background:#222;
  color:#fff;
  padding:12px 17px;
  border-radius:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
}

#toast.show{
  opacity:1;
}

.dark{
  --bg:#111218;
  --card:#1b1c25;
  --text:#f2f2f6;
  --muted:#a7a8b4;
  --line:#30313d;
  --shadow:0 12px 35px rgba(0,0,0,.25);

.dark .nav button{

}

.dark input,
.dark textarea,
.dark select{
  background:#1b1c25;

  }

  }

  .timer{

  }

</style>
</head>

<body>

<div class="app">

<header>

<div>
  <div class="brand">Study<span>Hub</span> ✨</div>
  <small>Dein smarter Lernbereich</small>
</div>

<button onclick="toggleDark()">🌙</button>

</header>

<nav class="nav" id="nav"></nav>

<main id="app"></main>

</div>

<div id="toast"></div>


<script>

/* =========================================================
   STUDYHUB PLUS
   ========================================================= */

const STORAGE_KEY="studyhub_plus_complete_v1";

const DEFAULT_DATA={
  grades:[],
  tasks:[],
  exams:[],
  materials:[],
  mistakes:[],
  reviews:[],
  sessions:[],
  templates:{
    weekly:"",
    summary:"",
    session:""
  },
  settings:{
    dark:false,
    dailyGoal:60
  },
  minutes:0,
  streak:0,
  lastStudy:"",
  brainDump:""
};

let db=loadDatabase();


/* =========================================================
   STORAGE
   ========================================================= */

function loadDatabase(){

  try{

    const saved=JSON.parse(
      localStorage.getItem(STORAGE_KEY)
    );

    return mergeDefaults(DEFAULT_DATA,saved||{});

  }catch(error){

    return JSON.parse(
      JSON.stringify(DEFAULT_DATA)
    );

  }

}


function mergeDefaults(base,saved){

  const result=JSON.parse(JSON.stringify(base));

  Object.keys(saved||{}).forEach(key=>{

    if(
      saved[key] &&
      typeof saved[key]==="object" &&
      !Array.isArray(saved[key]) &&
      typeof result[key]==="object" &&
      !Array.isArray(result[key])
    ){

      result[key]={
        ...result[key],
        ...saved[key]
      };

    }else{

      result[key]=saved[key];

    }

  });

  return result;

}


function saveDatabase(){

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(db)
  );

}


/* =========================================================
   HELPERS
   ========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/[&<>"']/g,function(char){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[char];

    });

}


function today(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function dateDE(date){

  if(!date) return "—";

  return new Date(
    date+"T00:00:00"
  ).toLocaleDateString("de-DE");

}


function daysUntil(date){

  return Math.ceil(
    (
      new Date(date+"T23:59:59")-
      new Date()
    )/
    86400000
  );

}


function average(values){

  if(!values.length) return 0;

  return values.reduce(
    (a,b)=>a+b,
    0
  )/values.length;

}


function toast(message){

  const element=
    document.getElementById("toast");

  element.textContent=message;

  element.classList.add("show");

  setTimeout(
    ()=>element.classList.remove("show"),
    1800
  );

}


/* =========================================================
   NAVIGATION
   ========================================================= */

const NAV_ITEMS=[

  ["🏠","Home","home"],
  ["📚","Noten","grades"],
  ["⏱️","Timer","timer"],
  ["✅","Aufgaben","tasks"],
  ["🎓","Exam Planner","exams"],
  ["🧠","Lernmaterial","materials"],
  ["🤖","Smart Study","smart"],
  ["🧪","Prüfungssimulator","simulator"],
  ["🧩","Wissenslücken","gaps"],
  ["🧹","Brain Dump","brain"],
  ["🔁","Wiederholen","review"],
  ["📊","Advanced Stats","stats"],
  ["✨","StudyHub Plus","plus"],
  ["⚙️","Einstellungen","settings"]

];


function renderNavigation(active){

  document.getElementById("nav").innerHTML=

    NAV_ITEMS.map(item=>`

      <button
        class="${active===item[2]?"active":""}"
        onclick="showPage('${item[2]}')"
      >

        ${item[0]} ${item[1]}

      </button>

    `).join("");

}


function showPage(page){

  renderNavigation(page);

  const pages={
    home:renderHome,
    grades:renderGrades,
    timer:renderTimer,
    tasks:renderTasks,
    exams:renderExams,
    materials:renderMaterials,
    smart:renderSmartStudy,
    simulator:renderSimulator,
    gaps:renderGaps,
    brain:renderBrainDump,
    review:renderReview,
    stats:renderStats,
    plus:renderPlus,
    settings:renderSettings
  };

  if(pages[page]){

    pages[page]();

  }

}


/* =========================================================
   HOME
   ========================================================= */

function renderHome(){

  const completed=
    db.tasks.filter(task=>task.done).length;

  const grade=
    db.grades.length
      ? average(
          db.grades.map(g=>+g.grade)
        ).toFixed(2)
      : "—";

  const nextExam=
    [...db.exams]
      .filter(e=>daysUntil(e.date)>=0)
      .sort(
        (a,b)=>
          daysUntil(a.date)-
          daysUntil(b.date)
      )[0];

  const openTasks=
    db.tasks
      .filter(t=>!t.done)
      .slice(0,5);

  document.getElementById("app").innerHTML=`

<section class="card hero">

  <h1>StudyHub Plus ✨</h1>

  <p>
    Dein kompletter Lern-Workflow —
    von der Prüfung bis zur letzten Wiederholung.
  </p>

  <div class="row" style="margin-top:16px">

    <button onclick="showPage('smart')">
      🤖 Was soll ich heute lernen?
    </button>

    <button onclick="showPage('brain')">
      🧹 Brain Dump
    </button>

    <button onclick="showPage('exams')">
      🎓 Prüfung planen
    </button>

  </div>

</section>


<div class="grid">

<div class="card">

<div class="label">Lernzeit</div>

<div class="stat">
${db.minutes} min
</div>

</div>


<div class="card">

<div class="label">
Aufgaben erledigt
</div>

<div class="stat">
${completed}
</div>

</div>


<div class="card">

<div class="label">
Notenschnitt
</div>

<div class="stat">
${grade}
</div>

</div>


<div class="card">

<div class="label">
Streak
</div>

<div class="stat">
🔥 ${db.streak}
</div>

</div>

</div>


<div class="grid2">

<div class="card">

<h2>🎓 Nächste Prüfung</h2>

${
nextExam
?
`

<div class="item">

<div class="spread">

<b>
${esc(nextExam.name)}
</b>

<span class="pill">
${daysUntil(nextExam.date)} Tage
</span>

</div>

<p class="muted">
${dateDE(nextExam.date)}
</p>

<div class="progress">

<span style="width:${nextExam.progress}%"></span>

</div>

<p class="small">
${nextExam.progress}% vorbereitet
</p>

<button
onclick="showPage('exams')"
>
Prüfung öffnen
</button>

`
:
`<p class="muted">

</p>`
}

</div>


<div class="card">

<h2>📋 Als Nächstes</h2>

<div class="list">

${
openTasks.length
?
openTasks.map(task=>`

<div class="item">

<b>
${esc(task.name)}
</b>

<div class="small muted">

${esc(task.subject||"Ohne Fach")}

${task.date
? " · "+dateDE(task.date)
: ""}

${task.minutes
? " · "+task.minutes+" min"
: ""}

</div>

</div>

`).join("")
:
`<p class="muted">
Alles erledigt 🎉
</p>`
}

</div>

</div>

</div>


<div class="card">

<h2>✨ Dein nächster sinnvoller Schritt</h2>

<div class="feature">

<div class="icon">🧠</div>

<div>

<b>
Nicht überlegen. Einfach starten.
</b>

<p class="muted">

StudyHub kann anhand deiner
Prüfungen und Aufgaben bestimmen,
was du als Nächstes machen solltest.

</p>

<button
class="primary"
onclick="showPage('smart')"
>
🤖 Smart Study öffnen
</button>

</div>

</div>

</div>

`;

}


/* =========================================================
   GRADES
   ========================================================= */

function renderGrades(){

  const averageGrade=
    weightedAverage();

  document.getElementById("app").innerHTML=`

<div class="card">

<h2>📚 Noten</h2>

<div class="formgrid">

<input
id="gradeSubject"
placeholder="Fach"
/>

<input
id="gradeValue"
type="number"
min="1"
max="6"
step="0.1"
placeholder="Note"
/>

<input
id="gradeWeight"
type="number"
min="1"
value="1"
placeholder="Gewichtung"
/>

<button
class="primary"
onclick="addGrade()"
>
➕ Note hinzufügen
</button>

</div>

</div>


<div class="card">

<h2>🎯 Dein aktueller Schnitt</h2>

<div class="score">
${averageGrade}
</div>

<p class="muted">
Gewichteter Durchschnitt
</p>


<hr>


<h3>
🎯 Welche Note brauche ich für mein Ziel?
</h3>

<div class="formgrid">

<input
id="targetGrade"
type="number"
min="1"
max="6"
step="0.1"
placeholder="Zielnote z.B. 2.0"
/>

<input
id="targetWeight"
type="number"
min="1"
value="1"
placeholder="Gewichtung nächste Note"
/>

</div>

<button
onclick="calculateTargetGrade()"
style="margin-top:10px"
>
Berechnen
</button>

<div
id="targetResult"
class="notice hidden"
style="margin-top:12px"
></div>

</div>


<div class="card">

<h2>Meine Noten</h2>

<table>

<tr>

<th>Fach</th>
<th>Note</th>
<th>Gewichtung</th>
<th></th>

</tr>

${
db.grades.map(
(g,index)=>`

<tr>

<td>
${esc(g.subject)}
</td>

<td>
${g.grade}
</td>

<td>
${g.weight}
</td>

<td>

<button
class="danger"
onclick="deleteGrade(${index})"
>
×
</button>

</td>

</tr>

`
).join("")
}

</table>

</div>

`;

}


function weightedAverage(){

  if(!db.grades.length)
    return "—";

  const weight=
    db.grades.reduce(
      (sum,g)=>sum+(+g.weight||1),
      0
    );

  const total=
    db.grades.reduce(
      (sum,g)=>
        sum+
        (+g.grade)*
        (+g.weight||1),
      0
    );

  return (total/weight).toFixed(2);

}


function addGrade(){

  const subject=
    document.getElementById("gradeSubject")
    .value.trim();

  const grade=
    +document.getElementById("gradeValue")
    .value;

  const weight=
    +document.getElementById("gradeWeight")
    .value||1;

  if(!subject||!grade){

    toast("Fach und Note eingeben.");

    return;

  }

  db.grades.push({
    subject,
    grade,
    weight
  });

  saveDatabase();

  renderGrades();

  toast("Note gespeichert.");

}


function deleteGrade(index){

  db.grades.splice(index,1);

  saveDatabase();

  renderGrades();

}


function calculateTargetGrade(){

  const target=
    +document.getElementById("targetGrade").value;

  const weight=
    +document.getElementById("targetWeight").value||1;

  if(!target){

    toast("Zielnote eingeben.");

    return;

  }

  const totalWeight=
    db.grades.reduce(
      (sum,g)=>sum+(+g.weight||1),
      0
    );

  const currentPoints=
    db.grades.reduce(
      (sum,g)=>
        sum+
        (+g.grade)*
        (+g.weight||1),
      0
    );

  const needed=
    (
      target*
      (totalWeight+weight)-
      currentPoints
    )/weight;

  const result=
    document.getElementById("targetResult");

  result.classList.remove("hidden");

  if(needed<=1){

    result.innerHTML=`
      🎉 Du kannst dein Ziel mit einer sehr guten nächsten Note erreichen.
      Benötigte Note:
      <b>${Math.max(1,needed).toFixed(2)}</b>
    `;

  }else if(needed<=6){

    result.innerHTML=`
      Du brauchst ungefähr
      <b>${needed.toFixed(2)}</b>
      bei dieser Gewichtung.
    `;

  }else{

    result.innerHTML=`
      Mit nur einer nächsten Note dieser Gewichtung
      ist das Ziel rechnerisch nicht erreichbar.
    `;

  }

}


/* =========================================================
   TIMER / LERNMODUS
   ========================================================= */

let timer={
  seconds:1500,
  running:false,
  mode:"focus",
  interval:null
};


function renderTimer(){

  document.getElementById("app").innerHTML=`

<div class="card center">

<h2>⏱️ Lernmodus</h2>

<p class="muted">
Ein Fokusblock dauert 25 Minuten.
Danach folgt eine kurze Pause.
</p>

<div
id="timerClock"
class="timer"
>
25:00
</div>

<span
class="pill"
id="timerLabel"
>
Fokus
</span>

<div
class="row"
style="justify-content:center;margin-top:15px"
>

<button
class="primary"
onclick="startTimer()"
>
▶ Start
</button>

<button
onclick="pauseTimer()"
>
⏸ Pause
</button>

<button
onclick="resetTimer()"
>
↺ Reset
</button>

</div>

<hr>

<div class="feature">

<div class="icon">🧠</div>

<div>

<b>
Lernmodus
</b>

<p class="muted">

Während eines Fokusblocks:
Handy weg, eine Aufgabe,
25 Minuten konzentrieren.

</p>

</div>

</div>

</div>

`;

  updateTimerDisplay();

}


function startTimer(){

  if(timer.running)
    return;

  timer.running=true;

  timer.interval=
    setInterval(()=>{

      timer.seconds--;

      updateTimerDisplay();

      if(timer.seconds<=0){

        pauseTimer();

        if(timer.mode==="focus"){

          db.minutes+=25;

          updateStreak();

          saveDatabase();

          toast(
            "🎉 Fokusblock geschafft!"
          );

          timer.mode="break";
          timer.seconds=300;

        }else{

          toast(
            "☀️ Pause vorbei!"
          );

          timer.mode="focus";
          timer.seconds=1500;

        }

        updateTimerDisplay();

      }

    },1000);

}


function pauseTimer(){

  timer.running=false;

  clearInterval(timer.interval);

}


function resetTimer(){

  pauseTimer();

  timer.mode="focus";

  timer.seconds=1500;

  updateTimerDisplay();

}


function updateTimerDisplay(){

  const clock=
    document.getElementById(
      "timerClock"
    );

  const label=
    document.getElementById(
      "timerLabel"
    );

  if(!clock)
    return;

  const minutes=
    Math.floor(timer.seconds/60);

  const seconds=
    timer.seconds%60;

  clock.textContent=
    String(minutes).padStart(2,"0")+
    ":"+
    String(seconds).padStart(2,"0");

  label.textContent=
    timer.mode==="focus"
      ?"Fokus"
      :"Pause";

}


function updateStreak(){

  const now=today();

  if(db.lastStudy!==now){

    db.streak++;

    db.lastStudy=now;

  }

}

function createSmartDay(minutes){

  let tasks=
    db.tasks
      .filter(t=>!t.done)
      .map(t=>{

        let score=0;

        if(t.date){

          const days=
            daysUntil(t.date);

          if(days<=0)
            score+=100;

          else
            score+=
              Math.max(
                0,
                50-days*3
              );

        }

        if(t.minutes<=minutes)
          score+=20;

        return {
          task:t,
          score
        };

      })
      .sort(
        (a,b)=>
          b.score-a.score
      );


  let selected=[];
  let remaining=minutes;


  for(const item of tasks){

    const task=item.task;

    const taskMinutes=
      task.minutes||25;

    if(
      taskMinutes<=remaining
    ){

      selected.push(task);

      remaining-=taskMinutes;

    }

  }


  if(
    !selected.length &&
    tasks.length
  ){

    selected=[
      tasks[0].task
    ];

  }


  const result=
    document.getElementById(
      "smartResult"
    );


  if(!selected.length){

    result.innerHTML=`

<div class="notice success">

🎉 Du hast keine offenen Aufgaben.

Vielleicht ist heute ein guter Tag
für Wiederholungen oder Wissenslücken.

</div>

`;

    return;

  }


  result.innerHTML=`

<div class="notice">

<h3>
🎯 Dein ${minutes}-Minuten-Plan
</h3>

<ol>

${selected.map(
task=>`

<li>

<b>
${esc(task.name)}
</b>

<span class="muted">
(${task.minutes||25} min)
</span>

</li>

`
).join("")}

</ol>


<button
class="primary"
onclick="showPage('tasks')"
>
▶ Jetzt starten
</button>

</div>

`;

}

function convertBrainDump(){

  const text=
    document.getElementById(
      "brainText"
    ).value.trim();

  if(!text){

    toast("Schreib zuerst etwas hinein.");

    return;

  }

  db.brainDump=text;


  const pieces=
    text
      .split(
        /\n|,|;|(?<=[.!?])\s+/
      )
      .map(
        x=>x.trim()
      )
      .filter(
        x=>x.length>2
      );


  let added=0;


  pieces.forEach(piece=>{

    const clean=
      piece
        .replace(
          /^(ich muss|muss|noch|ich sollte)\s+/i,
          ""
        )
        .replace(
          /[.!?]+$/,
          ""
        );


    if(
      clean &&
      !db.tasks.some(
        task=>
          task.name.toLowerCase()===
          clean.toLowerCase()
      )
    ){

      db.tasks.push({

        name:clean,

        subject:"",

        date:"",

        minutes:25,

        done:false

      });

      added++;

    }

  });


  saveDatabase();


  document.getElementById(
    "brainResult"
  ).innerHTML=`

<div class="notice success">

✅
<b>${added}</b>
Aufgaben wurden erstellt.

<button
onclick="showPage('tasks')"
>
Aufgaben öffnen
</button>

</div>

`;

}

function addReview(){

    ).value;

    return;

  }


  db.reviews.push({

    topic,

    next:
      new Date(
        Date.now()+
        days*86400000
      ).toISOString()

  });


  saveDatabase();

  renderReview();

}

  db.reviews.splice(index,1);

  db.minutes+=5;

function delayReview(index){

    new Date(
      Date.now()+
      3*86400000

  renderReview();

}

function toggleDark(){

  db.settings.dark=
    !db.settings.dark;

  saveDatabase();

  document.body.classList.toggle(
    "dark",
    db.settings.dark
  );

}


/* =========================================================
   EXPORT
   ========================================================= */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          db,
          null,
          2
        )
      ],
      {
        type:"application/json"
      }
    );


  const url=
    URL.createObjectURL(blob);

  const link=
    document.createElement("a");

  link.href=url;

  link.download=
    "studyhub-backup.json";

  link.click();

  URL.revokeObjectURL(url);

  toast(
    "Backup exportiert."
  );

}


/* =========================================================
   RESET
   ========================================================= */

function resetAllData(){

  const confirmed=
    confirm(
      "Wirklich alle StudyHub-Daten löschen?"
    );

  if(!confirmed)
    return;

  localStorage.removeItem(
    STORAGE_KEY
  );

  location.reload();

}


/* =========================================================
   START
   ========================================================= */

document.body.classList.toggle(
  "dark",
  db.settings.dark
);

showPage("home");
